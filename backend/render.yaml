services:
  - type: web
    name: bhavana-international-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: CONTACT_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_USER_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
